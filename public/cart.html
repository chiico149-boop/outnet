<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Bag — THE OUT FIT</title>
  <meta name="description" content="Review your shopping bag and check out securely with PayPal or USDT.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <section class="page-hero" style="background:none;padding-bottom:20px"><h1>Shopping bag</h1></section>
    <div id="cart-root"></div>
  </main>
  <script src="/js/common.js"></script>
  <script>
  (async () => {
    const { I, $, $$, esc, money, api, renderLayout, cart, toast } = TOF;
    await renderLayout();
    let method = 'usdt';
    let payInfo = { usdt: {}, paypalReceiver: '' };
    try { payInfo = await api('/api/pay-info'); } catch {}

    function render() {
      const items = cart.get();
      if (!items.length) {
        $('#cart-root').innerHTML = `<div class="empty">${I.bag}<h2>Your bag is empty</h2><p>Discover something you'll love.</p><a href="/shop" class="btn btn-gold mt-2">Start shopping</a></div>`;
        return;
      }
      const sub = items.reduce((a, i) => a + i.price * i.qty, 0);
      const ship = sub >= 150 ? 0 : 9.9;
      $('#cart-root').innerHTML = `
        <div class="cart-layout">
          <div>
            ${items.map((i, idx) => `
              <div class="cart-item">
                <a href="/product?id=${i.id}"><img src="${esc(i.image)}" alt=""></a>
                <div>
                  <a href="/product?id=${i.id}"><strong>${esc(i.title)}</strong></a>
                  <div class="hint">Sold by ${esc(i.seller)}${i.size ? ' · Size ' + esc(i.size) : ''}</div>
                  <div class="qty mt-1" style="transform:scale(.85);transform-origin:left"><button data-dec="${idx}">−</button><input value="${i.qty}" readonly><button data-inc="${idx}">+</button></div>
                </div>
                <div style="text-align:right"><div class="price">${money(i.price * i.qty)}</div><button class="btn btn-sm btn-danger mt-1" data-rm="${idx}">Remove</button></div>
              </div>`).join('')}
          </div>
          <div class="card">
            <h3 class="serif" style="font-size:1.4rem">Checkout</h3>
            <form id="checkout-form">
              <div class="field"><label for="b-name">Full name</label><input class="input" id="b-name" required></div>
              <div class="grid-2">
                <div class="field"><label for="b-email">Email</label><input class="input" type="email" id="b-email" required></div>
                <div class="field"><label for="b-phone">Phone</label><input class="input" id="b-phone"></div>
              </div>
              <div class="field"><label for="b-address">Address</label><input class="input" id="b-address" required></div>
              <div class="grid-3">
                <div class="field"><label for="b-city">City</label><input class="input" id="b-city"></div>
                <div class="field"><label for="b-zip">ZIP</label><input class="input" id="b-zip"></div>
                <div class="field"><label for="b-country">Country</label><input class="input" id="b-country"></div>
              </div>
              <label class="hint">Payment method</label>
              <div class="methods mt-1" style="grid-template-columns:repeat(2,1fr)">
                <div class="method ${method==='usdt'?'active':''}" data-m="usdt"><div class="m-ico">${I.usdt}</div><strong>USDT</strong></div>
                <div class="method ${method==='paypal'?'active':''}" data-m="paypal"><div class="m-ico">${I.paypal}</div><strong>PayPal</strong></div>
              </div>
              <div id="pay-fields"></div>
              <div class="summary-row"><span>Subtotal</span><span>${money(sub)}</span></div>
              <div class="summary-row"><span>Shipping</span><span>${ship ? money(ship) : 'Free'}</span></div>
              <div class="summary-row total"><span>Total</span><span>${money(sub + ship)}</span></div>
              <button class="btn btn-gold btn-block btn-lg mt-2" id="place-order">Place order</button>
            </form>
          </div>
        </div>`;
      renderPay();
      $$('[data-m]').forEach(m => m.onclick = () => { method = m.dataset.m; $$('[data-m]').forEach(x => x.classList.toggle('active', x === m)); renderPay(); });
      $$('[data-inc]').forEach(b => b.onclick = () => { const it = cart.get(); it[b.dataset.inc].qty = Math.min(20, it[b.dataset.inc].qty + 1); cart.save(it); render(); });
      $$('[data-dec]').forEach(b => b.onclick = () => { const it = cart.get(); it[b.dataset.dec].qty = Math.max(1, it[b.dataset.dec].qty - 1); cart.save(it); render(); });
      $$('[data-rm]').forEach(b => b.onclick = () => { const it = cart.get(); it.splice(b.dataset.rm, 1); cart.save(it); render(); });
      $('#checkout-form').onsubmit = placeOrder;
    }

    function renderPay() {
      const f = $('#pay-fields');
      if (method === 'paypal') f.innerHTML = `${payInfo.paypalReceiver ? `<p class="hint">Send the payment to <strong style="color:var(--text)">${esc(payInfo.paypalReceiver)}</strong> on PayPal.</p>` : ''}<div class="field"><label>PayPal email</label><input class="input" type="email" id="pp-email" required placeholder="you@example.com"></div>`;
      else {
        const nets = Object.keys(payInfo.usdt || {});
        const list = nets.length ? nets : ['TRC20'];
        f.innerHTML = `
        <div class="field"><label>Network</label><select class="input" id="u-net">${list.map(n => `<option value="${n}">USDT · ${n}</option>`).join('')}</select></div>
        <div class="field"><label>Send USDT to this address</label><div class="addr" style="display:flex;gap:8px;align-items:center;word-break:break-all"><span class="grow" id="u-addr">${esc((payInfo.usdt || {})[list[0]] || '')}</span><button type="button" class="icon-btn" style="width:34px;height:34px;flex-shrink:0" id="u-copy" title="Copy">${I.copy}</button></div></div>`;
        $('#u-net').onchange = () => ($('#u-addr').textContent = (payInfo.usdt || {})[$('#u-net').value] || '');
        $('#u-copy').onclick = () => navigator.clipboard.writeText($('#u-addr').textContent).then(() => toast('Address copied', 'success'));
      }
    }

    async function placeOrder(e) {
      e.preventDefault();
      const payment = method === 'paypal' ? { paypalEmail: $('#pp-email').value } : { network: $('#u-net').value };
      const btn = $('#place-order'); btn.disabled = true; btn.textContent = 'Processing…';
      try {
        const r = await api('/api/orders', { method: 'POST', body: {
          items: cart.get().map(i => ({ id: i.id, qty: i.qty, size: i.size })),
          buyer: { name: $('#b-name').value, email: $('#b-email').value, phone: $('#b-phone').value, address: $('#b-address').value, city: $('#b-city').value, zip: $('#b-zip').value, country: $('#b-country').value },
          paymentMethod: method, payment,
        }});
        cart.clear();
        $('#cart-root').innerHTML = `<div class="empty"><div style="color:var(--success)">${I.check}</div><h2>Thank you for your order!</h2><p>Order <strong>${esc(r.orderNumber)}</strong> · Total ${money(r.total)}</p><p class="text-2">A confirmation will be sent to your email once payment is verified.</p><a href="/" class="btn btn-gold mt-2">Continue shopping</a></div>`;
      } catch (err) { toast(err.message, 'error'); btn.disabled = false; btn.textContent = 'Place order'; }
    }
    render();
  })();
  </script>
</body>
</html>
