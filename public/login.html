<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Login — THE OUT FIT</title>
  <meta name="description" content="Log in to your THE OUT FIT seller account to manage listings, wallet and payouts.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-visual" style="background-image:url('/images/products/p02_wool_coat.png')">
      <div class="quote"><span class="eyebrow">Seller portal</span><h2>Welcome back to <span class="gold-text">THE OUT FIT</span></h2><p class="text-2">Manage your listings, track sales and get paid — all in one place.</p></div>
    </div>
    <div class="auth-form">
      <div class="box">
        <h1>Seller login</h1>
        <p class="text-2">Don't have an account? <a href="/signup.html" class="gold-text">Create one</a></p>
        <div id="msg"></div>
        <form id="login-form" class="mt-3">
          <div class="field"><label for="email">Email</label><input class="input" type="email" id="email" required autocomplete="email"></div>
          <div class="field"><label for="password">Password</label><input class="input" type="password" id="password" required autocomplete="current-password"></div>
          <button class="btn btn-gold btn-block btn-lg" id="login-btn">Log in</button>
        </form>
        <div class="divider">Demo account</div>
        <p class="hint center">elan@theoutfit.com · seller123</p>
      </div>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script>
  (async () => {
    const { $, api, renderLayout, esc } = TOF;
    await renderLayout();
    api('/api/auth/me').then(() => location.href = '/dashboard.html').catch(() => {});
    $('#login-form').onsubmit = async e => {
      e.preventDefault();
      const btn = $('#login-btn'); btn.disabled = true;
      try {
        await api('/api/auth/login', { method: 'POST', body: { email: $('#email').value, password: $('#password').value } });
        location.href = '/dashboard.html';
      } catch (err) { $('#msg').innerHTML = `<div class="alert error mt-2">${esc(err.message)}</div>`; btn.disabled = false; }
    };
  })();
  </script>
</body>
</html>
