<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — THE OUT FIT</title>
  <meta name="description" content="Product details, reviews and seller information at THE OUT FIT.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container" id="pdp-root">
    <div class="pdp"><div class="gallery-main skeleton"></div><div><div class="skeleton" style="height:300px"></div></div></div>
  </main>
  <script src="/js/common.js"></script>
  <script>
  (async () => {
    const { I, $, $$, esc, money, date, api, stars, avatar, productCard, cacheProducts, renderLayout, reveal, qs, cart, toast } = TOF;
    await renderLayout();
    let data;
    try { data = await api('/api/products/' + qs('id')); }
    catch { $('#pdp-root').innerHTML = `<div class="empty">${I.bag}<h1>Product not found</h1><a class="btn mt-2" href="/shop.html">Back to shop</a></div>`; return; }
    const { product: p, reviews, related, sellerProducts } = data;
    const s = p.seller;
    document.title = p.title + ' — THE OUT FIT';
    document.querySelector('meta[name=description]').content = p.description.slice(0, 155);
    const off = p.comparePrice > p.price ? Math.round((1 - p.price / p.comparePrice) * 100) : 0;
    let size = '', qty = 1;

    const dist = [5,4,3,2,1].map(n => ({ n, c: reviews.filter(r => r.rating === n).length }));

    $('#pdp-root').innerHTML = `
      <div class="crumbs" style="padding-top:28px"><a href="/">Home</a> / <a href="/shop.html?category=${p.category.slug}">${esc(p.category.name)}</a> / ${esc(p.title)}</div>
      <div class="pdp">
        <div>
          <div class="gallery-main"><img id="main-img" src="${esc(p.images[0])}" alt="${esc(p.title)}"></div>
          ${p.images.length > 1 ? `<div class="thumbs">${p.images.map((im, i) => `<img src="${esc(im)}" class="${i ? '' : 'active'}" alt="">`).join('')}</div>` : ''}
        </div>
        <div class="pdp-info">
          <span class="pill">${esc(p.category.name)}</span>
          <h1 class="mt-2">${esc(p.title)}</h1>
          <div class="rating-line">${stars(p.rating)} <a href="#reviews">${p.rating.toFixed(1)} · ${p.numReviews} reviews</a> · ${p.sales} sold</div>
          <div class="pdp-price"><span class="price">${money(p.price)}</span>${off ? `<span class="compare">${money(p.comparePrice)}</span><span class="pill success">Save ${off}%</span>` : ''}</div>
          <p class="text-2">${esc(p.description)}</p>
          ${p.colors?.length ? `<div class="opt-group"><label>Color: <strong>${esc(p.colors.join(' / '))}</strong></label></div>` : ''}
          ${p.sizes?.length ? `<div class="opt-group"><label>Select size</label><div class="chips" id="sizes">${p.sizes.map(z => `<button class="chip" data-size="${esc(z)}">${esc(z)}</button>`).join('')}</div></div>` : ''}
          <div class="flex wrap">
            <div class="qty"><button id="qty-minus" aria-label="Decrease">−</button><input id="qty" value="1" aria-label="Quantity"><button id="qty-plus" aria-label="Increase">+</button></div>
            <button class="btn btn-gold btn-lg grow" id="add-to-cart">${I.bag} Add to bag</button>
          </div>
          <button class="btn btn-block mt-2" id="buy-now">Buy it now</button>
          <p class="hint mt-1">${p.stock > 0 ? `${p.stock} in stock` : 'Out of stock'}</p>
          <div class="seller-box">
            ${avatar(s)}
            <div class="grow">
              <span class="hint">Sold by</span>
              <h3 style="margin:0;font-size:1.05rem"><a href="/seller.html?id=${s._id}">${esc(s.shopName || s.name)}</a></h3>
              <span class="hint">${sellerProducts} products · ${esc(s.country || '')}</span>
            </div>
            <a href="/seller.html?id=${s._id}" class="btn btn-sm">Visit shop</a>
          </div>
          <div class="perks">
            <div>${I.truck} Free shipping on orders over $150</div>
            <div>${I.refresh} 30-day easy returns</div>
            <div>${I.shield} Secure checkout — Card, PayPal & USDT</div>
          </div>
        </div>
      </div>

      <section class="section-sm" id="reviews">
        <div class="tabs"><button class="tab active">Reviews (${reviews.length})</button></div>
        <div class="review-summary">
          <div>
            <div class="big-rating">${p.rating.toFixed(1)}</div>
            ${stars(p.rating)}
            <p class="hint mt-1">Based on ${p.numReviews} reviews</p>
            <button class="btn btn-gold btn-sm mt-2" id="write-review">Write a review</button>
          </div>
          <div>${dist.map(d => `<div class="bar-row"><span>${d.n}★</span><div class="bar"><i style="width:${reviews.length ? d.c / reviews.length * 100 : 0}%"></i></div><span>${d.c}</span></div>`).join('')}</div>
        </div>
        <div id="review-list">${reviews.map(r => `
          <div class="review">
            <div class="review-head"><div class="flex"><div class="avatar avatar-fallback" style="width:38px;height:38px;margin:0;font-size:.9rem;padding:0">${esc(TOF.initials(r.name))}</div><div><strong>${esc(r.name)}</strong><div>${stars(r.rating)}</div></div></div><span class="hint">${date(r.createdAt)}</span></div>
            <p class="text-2 mb-0">${esc(r.comment)}</p>
          </div>`).join('') || '<p class="muted">No reviews yet. Be the first!</p>'}</div>
      </section>

      ${related.length ? `<section class="section-sm"><div class="section-head"><h2>You may also like</h2></div><div class="product-grid">${related.map(productCard).join('')}</div></section>` : ''}
    `;
    cacheProducts(related);
    reveal();

    $$('.thumbs img').forEach(t => t.addEventListener('click', () => { $('#main-img').src = t.src; $$('.thumbs img').forEach(x => x.classList.remove('active')); t.classList.add('active'); }));
    $$('#sizes .chip').forEach(c => c.addEventListener('click', () => { $$('#sizes .chip').forEach(x => x.classList.remove('active')); c.classList.add('active'); size = c.dataset.size; }));
    const setQty = v => { qty = Math.max(1, Math.min(20, parseInt(v) || 1)); $('#qty').value = qty; };
    $('#qty-minus').onclick = () => setQty(qty - 1);
    $('#qty-plus').onclick = () => setQty(qty + 1);
    $('#qty').onchange = e => setQty(e.target.value);
    const add = () => {
      if (p.sizes?.length && !size) { toast('Please select a size', 'error'); return false; }
      cart.add(p, qty, size); return true;
    };
    $('#add-to-cart').onclick = add;
    $('#buy-now').onclick = () => add() && (location.href = '/cart.html');

    const starSvg = I.star;
    $('#write-review').onclick = () => TOF.modal('Write a review', `
      <form id="review-form">
        <div class="field"><label>Your rating</label><div class="star-input">${[5,4,3,2,1].map(n => `<input type="radio" name="rating" id="r${n}" value="${n}" ${n===5?'checked':''}><label for="r${n}">${starSvg}</label>`).join('')}</div></div>
        <div class="field"><label for="rv-name">Your name</label><input class="input" id="rv-name" required maxlength="60"></div>
        <div class="field"><label for="rv-comment">Your review</label><textarea class="input" id="rv-comment" maxlength="1000" placeholder="What did you like?"></textarea></div>
        <button class="btn btn-gold btn-block" id="submit-review">Submit review</button>
      </form>`, { onOpen: (m, close) => {
        m.querySelector('#review-form').onsubmit = async e => {
          e.preventDefault();
          try {
            await api(`/api/products/${p._id}/reviews`, { method: 'POST', body: { name: m.querySelector('#rv-name').value, rating: m.querySelector('input[name=rating]:checked').value, comment: m.querySelector('#rv-comment').value } });
            toast('Thanks for your review!', 'success'); close(); setTimeout(() => location.reload(), 600);
          } catch (err) { toast(err.message, 'error'); }
        };
      }});
  })();
  </script>
</body>
</html>
