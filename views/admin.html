<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — THE OUT FIT</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Administration panel">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-top { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border); background: var(--bg-2); position: sticky; top: 0; z-index: 40; }
    .admin-login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 30% 20%, hsla(38, 70%, 45%, .18), transparent 50%), var(--bg); }
    .admin-login .card { width: 100%; max-width: 400px; padding: 40px; }
    .dash { min-height: calc(100vh - 70px); }
    .dash-side { top: 70px; height: calc(100vh - 70px); }
    .search-row { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
    .search-row .input { max-width: 320px; }
  </style>
</head>
<body>
  <!-- Login -->
  <div class="admin-login hidden" id="login-view">
    <form class="card glass" id="admin-login-form">
      <div class="center"><div class="logo" style="font-size:1.4rem">THE <span>OUT</span> FIT</div><p class="hint mt-1">Administration</p></div>
      <div id="login-msg" class="mt-2"></div>
      <div class="field mt-2"><label for="a-user">Username</label><input class="input" id="a-user" required autocomplete="username"></div>
      <div class="field"><label for="a-pass">Password</label><input class="input" type="password" id="a-pass" required autocomplete="current-password"></div>
      <button class="btn btn-gold btn-block btn-lg" id="admin-login-btn">Sign in</button>
    </form>
  </div>

  <!-- Panel -->
  <div class="hidden" id="panel-view">
    <header class="admin-top">
      <div class="flex"><a href="/" class="logo" style="font-size:1.25rem" target="_blank">THE <span>OUT</span> FIT</a><span class="pill">ADMIN</span></div>
      <button class="btn btn-sm" id="admin-logout"><span data-i="logout"></span> Log out</button>
    </header>
    <main class="dash">
      <aside class="dash-side">
        <nav class="dash-nav" id="admin-nav">
          <button data-tab="dashboard" class="active" id="an-dashboard"><span data-i="grid"></span>Dashboard</button>
          <button data-tab="sellers" id="an-sellers"><span data-i="users"></span>Sellers</button>
          <button data-tab="transactions" id="an-transactions"><span data-i="wallet"></span>Transactions <span class="count hidden" id="cnt-tx"></span></button>
          <button data-tab="reports" id="an-reports"><span data-i="flag"></span>Reports <span class="count hidden" id="cnt-rep"></span></button>
          <button data-tab="products" id="an-products"><span data-i="box"></span>Product listings</button>
          <button data-tab="catalog" id="an-catalog"><span data-i="plus"></span>Supplier catalog</button>
          <button data-tab="orders" id="an-orders"><span data-i="receipt"></span>Orders</button>
        </nav>
      </aside>
      <section class="dash-main" id="admin-main"></section>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
